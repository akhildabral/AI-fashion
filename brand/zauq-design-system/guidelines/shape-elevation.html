<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Resting things have no shadow. One float token, four users" name="Elevation" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:20px;align-items:flex-start;">
  <div class="sw"><div style="height:70px;width:150px;border-radius:var(--radius);background:var(--surface-raised);border:1px solid var(--border-hairline);"></div><span class="n">Card &middot; hairline only</span></div>
  <div class="sw"><div style="height:70px;width:150px;border-radius:var(--radius);background:var(--surface-raised);border:1px solid var(--border-accent);box-shadow:var(--shadow-float);"></div><span class="n">Menu / modal / toast</span></div>
  <div class="sw"><div class="zq-arch-bezel" style="width:64px;aspect-ratio:3 / 4;--arch-h:28%;"><div class="zq-arch-niche"></div></div><span class="n">Arch &middot; inset vitrine</span></div>
</div>
<p class="hex" style="margin:14px 0 0;max-width:560px;line-height:1.6;">Depth comes from the brass bezel, the lit niche and the film grain. If a card looks flat, fix the hairline, not the elevation.</p>
</body>
</html>
