<!-- @dsCard group="Colors" viewport="700x161" subtitle="Three states, each with its 10-12% wash" name="Semantic status" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="width:80px;background:rgb(var(--c-danger));"></div><span class="n">Danger</span><span class="hex">#D86C64</span></div>
  <div class="sw"><div class="chip" style="width:80px;background:rgb(var(--c-success));"></div><span class="n">Success</span><span class="hex">#8AB894</span></div>
  <div class="sw"><div class="chip" style="width:80px;background:rgb(var(--c-warning));"></div><span class="n">Warning</span><span class="hex">#C8A45E</span></div>
  <div style="display:flex;flex-direction:column;gap:6px;justify-content:center;">
    <p style="margin:0;border-radius:var(--radius);background:rgb(var(--c-danger)/0.1);padding:7px 14px;font-family:var(--font-sans);font-size:13px;color:rgb(var(--c-danger));">Photos up to 12MB.</p>
    <p style="margin:0;border-radius:var(--radius);background:rgb(var(--c-success)/0.12);padding:7px 14px;font-family:var(--font-sans);font-size:13px;color:rgb(var(--c-success));">Logged. Nine days running.</p>
  </div>
</div>
</body>
</html>
