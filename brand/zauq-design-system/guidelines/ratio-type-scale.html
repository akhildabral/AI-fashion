<!-- @dsCard group="Ratio" viewport="700x161" subtitle="A major third (1.25) on display; 1px steps on UI" name="Type scale ratio" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 24px;background:var(--surface-page)}
.n{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.m{font-family:ui-monospace,monospace;font-size:10px;color:var(--text-muted)}
.note{font-family:ui-monospace,monospace;font-size:10px;color:var(--text-faint);margin:12px 0 0}
.mini{border:1px solid var(--border-hairline);border-radius:var(--radius);background:var(--surface-raised)}
.cell{background:rgb(var(--c-iris) / .30);border-radius:2px;height:34px}
</style>
</head>
<body>

<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
<div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:44px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">72</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:44px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">60</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:44px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">48</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:36px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">36</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">30</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">24</p></div><div style="text-align:center"><span style="font-family:var(--font-display);font-weight:500;font-size:20px;line-height:1;color:var(--text-strong)">Aa</span><p class="m" style="margin:6px 0 0">20</p></div>
</div>
<p class="note">72 · 60 · 48 · 36 · 30 · 24 · 20 — each step ≈ &divide;1.25. UI sizes do NOT follow the ratio: 17 · 15 · 14 · 13 · 12 · 11 · 10, one pixel at a time, because labels must sit on a 4px control grid.</p>
</body></html>
