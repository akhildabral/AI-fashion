<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px;font-family:var(--font-sans);">
  <p style="margin:0;font-size:17px;color:var(--text-body);">17px &middot; landing lead. For the day you have and the weather outside.</p>
  <p style="margin:0;font-size:15px;color:var(--text-body);">15px &middot; body. Every wear logged, every piece earning its keep.</p>
  <p style="margin:0;font-size:14px;font-weight:600;color:var(--text-strong);">14px 600 &middot; the button and field size</p>
  <p style="margin:0;font-size:13px;color:var(--text-muted);">13px &middot; chips, filters, nav</p>
  <p style="margin:0;font-size:12px;color:var(--text-muted);">12px &middot; meta and counts</p>
  <p style="margin:0;font-size:11px;color:var(--text-muted);">11px &middot; tile labels</p>
</div>
</body>
</html>
