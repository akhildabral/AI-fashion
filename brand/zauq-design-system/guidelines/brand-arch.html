<!-- @dsCard group="Brand" viewport="700x210" subtitle="One curved form, one crown geometry, every aspect" name="The arch" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row" style="align-items:flex-end;gap:16px;">
  <div class="sw"><div class="zq-arch-bezel" style="width:84px;aspect-ratio:3 / 4;--arch-h:28%;"><div class="zq-arch-niche"></div></div><span class="n">3/4</span><span class="hex">28%</span></div>
  <div class="sw"><div class="zq-arch-bezel" style="width:84px;aspect-ratio:4 / 5;--arch-h:29.8%;"><div class="zq-arch-niche"></div></div><span class="n">4/5</span><span class="hex">29.8%</span></div>
  <div class="sw"><div class="zq-arch-bezel" style="width:84px;aspect-ratio:5 / 6;--arch-h:31.1%;"><div class="zq-arch-niche"></div></div><span class="n">5/6</span><span class="hex">31.1%</span></div>
  <div class="sw"><div class="zq-arch-bezel" style="width:84px;aspect-ratio:1 / 1;--arch-h:37.3%;"><div class="zq-arch-niche"></div></div><span class="n">1/1</span><span class="hex">37.3%</span></div>
  <div class="sw"><div class="zq-arch-bezel" style="width:120px;aspect-ratio:4 / 3;--arch-h:49.7%;"><div class="zq-arch-niche"></div></div><span class="n">4/3</span><span class="hex">49.7%</span></div>
</div>
<p class="hex" style="margin:14px 0 0;max-width:580px;line-height:1.6;">The crown is always 46% of the width across and 0.373&times; the width tall, so a landscape board and a portrait mirror share one arch. Feet carry a 5px radius.</p>
</body>
</html>
