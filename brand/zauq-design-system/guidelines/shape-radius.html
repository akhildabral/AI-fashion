<!-- @dsCard group="Spacing" viewport="700x164" subtitle="The system is sharp: 3px, everywhere, forever" name="Radius" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row" style="align-items:flex-end;">
  <div class="sw"><div style="height:56px;width:96px;border-radius:2px;border:1px solid var(--border-control);"></div><span class="n">2px &middot; filter, tape thumb</span></div>
  <div class="sw"><div style="height:56px;width:96px;border-radius:3px;background:var(--surface-raised);border:1px solid var(--border-hairline);"></div><span class="n">3px &middot; everything</span></div>
  <div class="sw"><div style="height:56px;width:96px;border-radius:5px;border:1px solid var(--border-accent);"></div><span class="n">5px &middot; the arch’s feet</span></div>
  <div class="sw"><div style="height:56px;width:56px;border-radius:28px;border:1px dashed rgb(var(--c-danger)/0.5);"></div><span class="n" style="color:rgb(var(--c-danger));">never</span></div>
</div>
<p class="hex" style="margin:14px 0 0;">No pills, no circles. The one curved form is the arch, and it is a brand device rather than a radius choice.</p>
</body>
</html>
