<!-- @dsCard group="Layout" viewport="700x236" subtitle="Every page is one of five centred measures" name="Measures" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 24px;background:var(--surface-page)}
.n{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.m{font-family:ui-monospace,monospace;font-size:10px;color:var(--text-muted)}
.note{font-family:ui-monospace,monospace;font-size:10px;color:var(--text-faint);margin:12px 0 0}
.mini{border:1px solid var(--border-hairline);border-radius:var(--radius);background:var(--surface-raised)}
.cell{background:rgb(var(--c-iris) / .30);border-radius:2px;height:34px}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:9px">
<div style="display:flex;align-items:center;gap:12px"><span class="m" style="flex:none;width:140px">--measure-prose</span><span class="mini" style="height:14px;width:182px;background:rgb(var(--c-iris) / .30);border-color:var(--border-accent)"></span><span class="m" style="flex:none;width:38px;text-align:right">672</span><span class="n" style="flex:1">reading, one column</span></div><div style="display:flex;align-items:center;gap:12px"><span class="m" style="flex:none;width:140px">--measure-narrow</span><span class="mini" style="height:14px;width:208px;background:rgb(var(--c-iris) / .30);border-color:var(--border-accent)"></span><span class="m" style="flex:none;width:38px;text-align:right">768</span><span class="n" style="flex:1">auth, legal, settings</span></div><div style="display:flex;align-items:center;gap:12px"><span class="m" style="flex:none;width:140px">--measure</span><span class="mini" style="height:14px;width:313px;background:rgb(var(--c-iris) / .30);border-color:var(--border-accent)"></span><span class="m" style="flex:none;width:38px;text-align:right">1152</span><span class="n" style="flex:1">the default page</span></div><div style="display:flex;align-items:center;gap:12px"><span class="m" style="flex:none;width:140px">--measure-wide</span><span class="mini" style="height:14px;width:380px;background:rgb(var(--c-iris) / .30);border-color:var(--border-accent)"></span><span class="m" style="flex:none;width:38px;text-align:right">1400</span><span class="n" style="flex:1">header + the Closet board</span></div><div style="display:flex;align-items:center;gap:12px"><span class="m" style="flex:none;width:140px">--measure-modal</span><span class="mini" style="height:14px;width:139px;background:rgb(var(--c-iris) / .30);border-color:var(--border-accent)"></span><span class="m" style="flex:none;width:38px;text-align:right">512</span><span class="n" style="flex:1">every modal</span></div>
</div>
<p class="note">Centred with mx-auto. The measure never changes with content — a short page is short, not narrow.</p>
</body></html>
