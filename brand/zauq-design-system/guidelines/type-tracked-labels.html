<!-- @dsCard group="Type" viewport="700x258" subtitle="The brand’s most-repeated gesture: caps, wide, faint" name="The tracked label" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans);">
  <div><span style="font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-accent);">The morning</span>
    <p style="margin:6px 0 0;font-family:var(--font-display);font-size:30px;font-weight:500;color:var(--text-strong);">Open the app. <em style="color:var(--text-accent);">It’s laid out.</em></p></div>
  <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border-hairline);padding-top:14px;">
    <span style="font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-accent);">0.28em &middot; eyebrow, brass</span>
    <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);">0.18em &middot; field label</span>
    <span style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-strong);">0.14em &middot; tab and nav</span>
    <span style="font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-body);">0.12em &middot; garment tile label</span>
  </div>
</div>
</body>
</html>
