<!-- @dsCard group="Brand" viewport="700x180" subtitle="Three curves, a 12px rise, and a 0.97 press" name="Motion" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<style>
  @keyframes demo-rise { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
  .d { animation: demo-rise 0.6s cubic-bezier(0.2,0.7,0.2,1) infinite alternate; }
</style>
<div class="row" style="gap:16px;align-items:flex-start;">
  <div class="sw"><div class="d" style="height:60px;width:110px;border-radius:var(--radius);background:var(--surface-raised);border:1px solid var(--border-hairline);"></div><span class="n">rise &middot; 12px, 600ms</span></div>
  <div class="sw"><div class="d" style="height:60px;width:110px;border-radius:var(--radius);background:var(--surface-raised);border:1px solid var(--border-hairline);animation-delay:.06s;"></div><span class="n">stagger &middot; 55ms, cap 8</span></div>
  <div style="display:flex;flex-direction:column;gap:6px;font-family:ui-monospace,monospace;font-size:10.5px;line-height:1.9;color:var(--text-muted);">
    <span>--ease-out &nbsp;&nbsp;&nbsp;cubic-bezier(.23, 1, .32, 1)</span>
    <span>--ease-in-out cubic-bezier(.77, 0, .175, 1)</span>
    <span>--ease-drawer cubic-bezier(.32, .72, 0, 1)</span>
    <span>--ease-rise &nbsp;&nbsp;cubic-bezier(.2, .7, .2, 1)</span>
    <span style="color:var(--text-accent);">press &rarr; scale(0.97) in 150ms, every tappable</span>
  </div>
</div>
</body>
</html>
