<!-- @dsCard group="Colors" viewport="700x160" subtitle="One accent, four steps. Brass means act, or you are here" name="Brass — the accent" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="width:96px;background:rgb(var(--c-iris));"></div><span class="n">Brass / fill</span><span class="hex">#C8A45E</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:rgb(var(--c-iris-deep));"></div><span class="n">Deep / hover</span><span class="hex">#D9B87A</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:rgb(var(--c-iris-deeper));"></div><span class="n">Deeper / text</span><span class="hex">#E4CB94</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:rgb(var(--c-iris-soft));"></div><span class="n">Soft / wash</span><span class="hex">#2A2114</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:rgb(var(--c-on-brass));"></div><span class="n">On brass</span><span class="hex">#1A1509</span></div>
</div>
<p class="hex" style="margin:14px 0 0;max-width:560px;line-height:1.6;">In the light theme brass darkens to #B98C3B so it holds contrast on paper. Filters never take brass; if everything is brass, nothing is.</p>
</body>
</html>
