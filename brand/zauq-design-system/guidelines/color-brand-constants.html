<!-- @dsCard group="Brand" viewport="700x150" subtitle="The logo’s own four colours — never themed, never tinted" name="Identity palette" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="width:96px;background:var(--brand-gold);"></div><span class="n">Gold</span><span class="hex">#D8B26A</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:var(--brand-ink);"></div><span class="n">Ink</span><span class="hex">#0B0A09</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:var(--brand-cream);"></div><span class="n">Cream</span><span class="hex">#F2EDE3</span></div>
  <div class="sw"><div class="chip" style="width:96px;background:var(--brand-neutral);"></div><span class="n">Neutral</span><span class="hex">#D6CFC0</span></div>
</div>
<p class="hex" style="margin:14px 0 0;max-width:560px;line-height:1.6;">Identity gold (#D8B26A) is a printing decision and sits slightly warmer than product brass. Use these on packaging, tags and the mark; use the themed brass tokens inside the interface.</p>
</body>
</html>
