<!-- @dsCard group="Brand" viewport="700x230" subtitle="Wordmark primary, arch mark secondary, solid below 32px" name="Logo lockups" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:18px;">
  <div class="row" style="align-items:center;gap:34px;">
    <img src="../assets/brand/zauq-wordmark-cream.png" alt="ZAUQ" style="height:26px;" />
    <img src="../assets/brand/zauq-mark-cream.png" alt="" style="height:52px;" />
    <img src="../assets/brand/favicon.svg" alt="" style="height:36px;" />
  </div>
  <div class="row" style="align-items:center;gap:26px;border-top:1px solid var(--border-hairline);padding-top:16px;">
    <span style="font-family:var(--font-brand);font-size:24px;text-transform:uppercase;color:var(--text-strong);"><span style="letter-spacing:.24em;">Z</span><span style="letter-spacing:.20em;">A</span><span style="letter-spacing:.16em;">U</span>Q</span>
    <span class="hex">live type &middot; ZA .24em / AU .20em / UQ .16em</span>
  </div>
  <p class="hex" style="margin:0;max-width:580px;line-height:1.6;">Wordmark minimum 88px wide on screen. Clear space equals the cap-height of the Z on all sides; for the mark, half the arch width.</p>
</div>
</body>
</html>
