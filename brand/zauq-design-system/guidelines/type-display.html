<!-- @dsCard group="Type" viewport="700x190" subtitle="The voice. Weight 500, never bold, tracking -0.01em" name="Display — Bodoni Moda" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 60px; border-radius: var(--radius); border: 1px solid var(--border-hairline); }
  .n { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:8px;">
  <p style="margin:0;font-family:var(--font-display);font-size:60px;font-weight:500;line-height:0.98;letter-spacing:-0.01em;color:var(--text-strong);">Already <em style="color:var(--text-accent);">waiting.</em></p>
  <p style="margin:0;font-family:var(--font-display);font-size:30px;font-weight:500;line-height:1.04;color:var(--text-strong);">Your closet, working.</p>
  <p style="margin:0;font-family:var(--font-display);font-size:20px;font-weight:400;font-style:italic;color:var(--text-muted);">It knows your closet. It lays out the look.</p>
  <div class="hex" style="margin-top:4px;">72 / 60 / 48 / 36 / 30 / 24 / 20 &nbsp;&middot;&nbsp; italic carries emphasis, never bold</div>
</div>
</body>
</html>
