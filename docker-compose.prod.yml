# Production stack: Postgres + backend + Caddy (TLS + static frontend).
#
#   cp deploy/vps.env.example .env.prod            # compose-level settings
#   cp deploy/backend.env.example deploy/backend.env   # app secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# See DEPLOY.md for the full VPS runbook.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ai_fashion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d ai_fashion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./deploy/backend.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fashion:${POSTGRES_PASSWORD}@db:5432/ai_fashion
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/extra-sites:/etc/caddy/extra:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  models:
  caddy_data:
  caddy_config:
