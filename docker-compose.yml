services:
  db:
    image: postgres:16-alpine
    container_name: ai-fashion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion}
      POSTGRES_DB: ${POSTGRES_DB:-ai_fashion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashion} -d ${POSTGRES_DB:-ai_fashion}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
