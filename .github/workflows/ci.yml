name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  # The web app and the shared package live in the pnpm workspace at the
  # repo root (the mobile app too, but it is not built here).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter ai-fashion-frontend...
      - run: pnpm --filter @zauq/shared typecheck
      - run: pnpm --filter ai-fashion-frontend build

  # Deploys to the VPS after tests pass on main. Skips cleanly until the
  # repository secrets exist: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key
  # for the deploy user), optional VPS_PORT (default 22).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Skip when VPS secrets are not configured
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST secret not set — skipping deploy."
      # The SSH handshake to the VPS drops now and then. A green build must not
      # fail on that, so the deploy gets a second try a minute later; the
      # script is idempotent (reset to origin/main, then deploy.sh).
      - name: Deploy over SSH (git pull + rebuild)
        id: deploy
        if: env.VPS_HOST != ''
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Connection (not command) timeout — the default 30s was being hit
          # during the SSH handshake and failing the whole deploy.
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd ~/ai-fashion
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
      - name: Wait before the second try
        if: env.VPS_HOST != '' && steps.deploy.outcome == 'failure'
        run: sleep 60
      - name: Deploy over SSH (second try)
        id: deploy2
        if: env.VPS_HOST != '' && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd ~/ai-fashion
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
