<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flipkart reCAPTCHA</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="captcha-container">
  <h2>Please verify you are a human</h2>
  <form method="POST" action="/captcha/validate">
    <div class="g-recaptcha" data-sitekey="6Lf-abcdefghijklmnopqrstuvwxyz1234567890"></div>
    <input type="hidden" name="x-captcha-validate" value="1">
    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
